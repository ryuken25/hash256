[package]
name = "hash256"
version = "0.1.0"
edition = "2021"
description = "Production HASH token PoW miner with OpenCL GPU, standalone and coordinator/worker cluster modes"
license = "MIT"

[dependencies]
alloy = { version = "0.8", features = [
    "providers",
    "signers",
    "signer-local",
    "sol-types",
    "contract",
    "network",
    "consensus",
    "eips",
    "rpc-types-eth",
    "reqwest",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
eyre = "0.6"
rpassword = "7"
num_cpus = "1"
rand = "0.8"
dotenvy = "0.15"
ocl = { version = "0.19", optional = true }
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha3 = "0.10"
rlp = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["gpu"]
gpu = ["dep:ocl"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
